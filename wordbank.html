<!DOCTYPE html>
<html lang="zh-Hant"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中文詞語學習寶</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: "Kaiti TC", "STKaiti", "DFKai-SB", "BiauKai", "標楷體", serif;
            background-color: #FFF;
            color: #000;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            font-weight: normal;
        }

        header {
            background-color: #000;
            color: #FFF;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.8rem;
        }

        .header-btn {
            background-color: #6C757D;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
        }

        #lesson-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 20px;
        }

        .lesson-btn {
            background-color: #FFF;
            border: 6px solid #000;
            border-radius: 20px;
            padding: 30px 50px;
            font-size: 3.5rem;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
            width: 80%;
            max-width: 600px;
        }
        .lesson-btn:active { background-color: #E0E0E0; }

        #main-page {
            display: none;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
        }

        #grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 25px;
            padding-bottom: 50px;
        }

        .word-card {
            background-color: #FFF;
            border: 3px solid #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            cursor: pointer;
            border-radius: 20px;
        }

        .word-card:active { background-color: #F0F0F0; }

        .word-card img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .word-card span { font-size: 3rem; }

        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #FFF;
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #overlay-img { max-width: 45%; max-height: 40vh; margin-bottom: 15px; object-fit: contain; }
        #overlay-text { font-size: 20vh; line-height: 1.1; margin-bottom: 25px; } 

        .btn-group { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .action-btn {
            padding: 20px 35px;
            font-size: 2rem;
            border-radius: 15px;
            border: 3px solid #000;
            cursor: pointer;
            font-family: inherit;
        }
        #read-again-btn { background-color: #007BFF; color: white; }
        #small-challenge-btn { background-color: #28A745; color: white; }
        #big-challenge-btn { background-color: #FF8C00; color: white; }
        #overlay-back-btn { background-color: #6C757D; color: white; }

        #quiz-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #FFF;
            z-index: 200;
            flex-direction: column;
        }

        .quiz-header {
            height: 12vh;
            padding: 0 20px;
            background: #EEE;
            border-bottom: 4px solid #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quiz-layout { 
            display: flex; 
            height: 88vh; 
            padding: 15px; 
            gap: 15px;
        }

        .quiz-choice {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            border: 12px solid #000;
            border-radius: 30px;
            cursor: pointer;
            overflow: hidden; 
            padding: 10px;
        }

        .quiz-choice img { 
            max-width: 90%; 
            height: 40%; 
            object-fit: contain; 
            margin-bottom: 2vh; 
        }

        .correct-flash { background-color: #D4EDDA !important; border-color: #28A745 !important; }
        .wrong-flash { background-color: #F8D7DA !important; border-color: #DC3545 !important; }
    </style>
</head>
<body>

    <div id="lesson-page" style="display: none;">
        <h1 style="font-size: 3rem;">📚 請選擇課文</h1>
        <button class="lesson-btn" onclick="loadLesson('arrow')">🏹 草船借箭</button>
        <button class="lesson-btn" onclick="loadLesson('tiger')">🐯 武松打虎</button>
    </div>

    <div id="main-page" style="display: flex;">
        <header>
            <span id="lesson-title">草船借箭</span>
            <button class="header-btn" onclick="showLessons()">返回目錄</button>
        </header>
        <div id="grid-container"></div>
    </div>

    <div id="overlay">
        <img id="overlay-img" src="" alt="">
        <div id="overlay-text"></div>
        <div class="btn-group">
            <button id="overlay-back-btn" class="action-btn" onclick="closeOverlay()">返回</button>
            <button id="read-again-btn" class="action-btn" onclick="speak(targetWord)">讀多次</button>
            <button id="small-challenge-btn" class="action-btn" onclick="startQuiz('small')">小挑戰(有圖)</button>
            <button id="big-challenge-btn" class="action-btn" onclick="startQuiz('big')">大挑戰(無圖)</button>
        </div>
    </div>

    <div id="quiz-container">
        <div class="quiz-header">
            <span id="quiz-question-text" style="font-size:2.2rem;">請找出：</span>
            <button class="action-btn" style="font-size: 1.5rem; padding: 10px 20px;" onclick="closeQuiz()">返回</button>
        </div>
        <div class="quiz-layout">
            <div id="opt-left" class="quiz-choice" onclick="checkAnswer('left')"></div>
            <div id="opt-right" class="quiz-choice" onclick="checkAnswer('right')"></div>
        </div>
    </div>

    <script>
        const lessonsData = {
            "arrow": {
                title: "草船借箭",
                words: [
                    { word: "艱難", img: "difficult.jpg" },
                    { word: "收集", img: "collect.jpg" },
                    { word: "冷靜", img: "claim.jpg" },
                    { word: "慌張", img: "shock.png" },
                    { word: "精彩", img: "thumbup.jpg" },
                    { word: "大霧", img: "Mo.jpg" },
                    { word: "射箭", img: "jin.jpeg" },
                    { word: "一本", img: "book.jpg" },
                    { word: "一艘", img: "ship.jpeg" },
                    { word: "一枝", img: "stick.jpg" },
                    { word: "一位", img: "person.jpg" }
                ]
            },
            "tiger": {
                title: "武松打虎",
                words: [
                    { word: "勇敢", img: "brave.webp" },
                    { word: "精彩", img: "clap.webp" },
                    { word: "危險", img: "danger.jpg" },
                    { word: "樹林", img: "forest.jpg" },
                    { word: "高興", img: "happy.png" },
                    { word: "求助", img: "help.png" },
                    { word: "打敗", img: "lose.webp" },
                    { word: "精彩", img: "thumbup.jpg" },
                    { word: "老虎", img: "tiger.jpg" }
                ]
            }
        };

        let currentWords = [];
        let targetWord = "";
        let targetImg = "";
        const synth = window.speechSynthesis;

        function speak(text) {
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-HK';
            utter.rate = 0.5; 
            synth.speak(utter);
        }

        function showLessons() {
            document.getElementById('main-page').style.display = 'none';
            document.getElementById('lesson-page').style.display = 'flex';
        }

        function loadLesson(lessonKey) {
            const lesson = lessonsData[lessonKey];
            currentWords = lesson.words;
            
            document.getElementById('lesson-title').innerText = lesson.title;
            const grid = document.getElementById('grid-container');
            grid.innerHTML = ''; 

            currentWords.forEach(item => {
                const div = document.createElement('div');
                div.className = 'word-card';
                div.innerHTML = `<img src="${item.img}" onerror="this.style.visibility='hidden'"><span>${item.word}</span>`;
                div.onclick = () => {
                    targetWord = item.word;
                    targetImg = item.img;
                    document.getElementById('overlay-img').src = item.img;
                    document.getElementById('overlay-text').innerText = item.word;
                    document.getElementById('overlay').style.display = 'flex';
                    speak(item.word);
                };
                grid.appendChild(div);
            });

            document.getElementById('lesson-page').style.display = 'none';
            document.getElementById('main-page').style.display = 'flex';
        }

        function closeOverlay() { document.getElementById('overlay').style.display = 'none'; }
        function closeQuiz() { document.getElementById('quiz-container').style.display = 'none'; }

        function startQuiz(mode) {
            document.getElementById('quiz-container').style.display = 'flex';
            
            let wrongItem = currentWords[Math.floor(Math.random() * currentWords.length)];
            while (wrongItem.word === targetWord && currentWords.length > 1) {
                wrongItem = currentWords[Math.floor(Math.random() * currentWords.length)];
            }

            const isTargetLeft = Math.random() > 0.5;
            const leftEl = document.getElementById('opt-left');
            const rightEl = document.getElementById('opt-right');

            const left = isTargetLeft ? {w: targetWord, i: targetImg} : {w: wrongItem.word, i: wrongItem.img};
            const right = isTargetLeft ? {w: wrongItem.word, i: wrongItem.img} : {w: targetWord, i: targetImg};

            function getOptimalFontSize(word) {
                const charCount = word.length;
                const maxVw = 40; 
                const vwSize = maxVw / charCount; 
                const maxVh = mode === 'small' ? 35 : 60;
                return `min(${vwSize}vw, ${maxVh}vh)`;
            }

            const leftFontSize = getOptimalFontSize(left.w);
            const rightFontSize = getOptimalFontSize(right.w);

            if (mode === 'small') {
                leftEl.innerHTML = `<img src="${left.i}" onerror="this.style.visibility='hidden'"><span style="font-size: ${leftFontSize}; line-height: 1; white-space: nowrap;">${left.w}</span>`;
                rightEl.innerHTML = `<img src="${right.i}" onerror="this.style.visibility='hidden'"><span style="font-size: ${rightFontSize}; line-height: 1; white-space: nowrap;">${right.w}</span>`;
            } else {
                leftEl.innerHTML = `<span style="font-size: ${leftFontSize}; line-height: 1; white-space: nowrap;">${left.w}</span>`;
                rightEl.innerHTML = `<span style="font-size: ${rightFontSize}; line-height: 1; white-space: nowrap;">${right.w}</span>`;
            }
            
            leftEl.className = 'quiz-choice';
            rightEl.className = 'quiz-choice';
            document.getElementById('quiz-question-text').innerText = `請點選「${targetWord}」`;
            speak(`找出${targetWord}`);
        }

        function checkAnswer(side) {
            const selectedEl = document.getElementById(side === 'left' ? 'opt-left' : 'opt-right');
            const selectedText = selectedEl.querySelector('span').innerText;

            if (selectedText === targetWord) {
                speak("答對了");
                selectedEl.classList.add('correct-flash');
                setTimeout(() => {
                    closeQuiz();
                    closeOverlay();
                }, 1500);
            } else {
                speak("不對，請找出" + targetWord);
                selectedEl.classList.add('wrong-flash');
                setTimeout(() => selectedEl.classList.remove('wrong-flash'), 1000);
            }
        }

        window.onload = function() {
            loadLesson('arrow');
        };
    </script>

</body></html>
